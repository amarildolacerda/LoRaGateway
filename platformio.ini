; PlatformIO Project Configuration File
;
; Naming convention:
;   [env:<deviceType>_<board>_<radioTech>]
;   deviceType: gw (Gateway) or term (Terminal)
;   board: heltec, ttgo, d1, nano, rboard, sensor
;   radioTech: lora, rf95, nrf24

; ======================
; Common Configurations
; ======================

[platform]
monitor_raw = yes


[esp32]
lib_deps = 
    bblanchon/ArduinoJson @ ^6.21.2
    arduino-libraries/NTPClient @ ^3.2.1
    esphome/ESPAsyncWebServer-esphome @ ^3.3.0
    https://github.com/alanswx/ESPAsyncWiFiManager.git
    https://github.com/ropg/ezTime.git


[esp8266]
lib_deps = 
    https://github.com/alanswx/ESPAsyncWiFiManager.git
    arduino-libraries/NTPClient @ ^3.2.1
    esphome/ESPAsyncWebServer-esphome @ ^3.3.0
    bblanchon/ArduinoJson@6.19.4
    arduino-libraries/WiFi@^1.2.7
    https://github.com/ropg/ezTime.git




[ttgo]
lib_deps = 
#    file:://../lib
    bblanchon/ArduinoJson @ ^6.21.2
    https://github.com/alanswx/ESPAsyncWiFiManager.git
    https://github.com/ropg/ezTime.git

[HeltecV2]
lib_deps = 
    bblanchon/ArduinoJson @ ^6.21.2
    sandeepmistry/LoRa @ ^0.8.0
    arduino-libraries/NTPClient @ ^3.2.1
    esphome/ESPAsyncWebServer-esphome @ ^3.3.0
    eiannone/Heltec_Esp32_Display@^0.1.0
    https://github.com/alanswx/ESPAsyncWiFiManager.git
    https://github.com/ropg/ezTime.git

build_flags = 
    -D HELTEC
    -D DISPLAY_ENABLED
    -D DISPLAYHELTEC
    -D LORA
    -D WIFI

[avr]
build_flags = 
    -D MESH
    -D LORA
    -D LORA_PROMISCUOS=true
lib_deps = 
    SoftwareSerial
    seeed-studio/Grove - LoRa Radio 433MHz 868MHz @ ^2.0.0

[env:gw_ESP_MESH]  
;platform = espressif8266
;board =  nodemcuv2  ;esp8285 ;nodemcuv2 ;esp8285  ; Ou use generic8266 se esp8285 não estiver disponível
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
;board_build.partitions = partitions.csv
upload_port = COM11
monitor_port = COM11
;platform_packages = 
;    platform = espressif8266@1.5.0 ;framework-arduinoespressif8266 @ https://github.com/esp8266/Arduino.git
lib_deps = 
    ${esp32.lib_deps}
    ;Preferences
   
    
    ;WiFiManager
    ;painlessMesh


build_flags = 
    -D TEST
    ;-D PIO_FRAMEWORK_ARDUINO_ESPRESSIF_SDK22y
    ;-O3
    -D GATEWAY
    -D TERMINAL_NAME=\"ESP_MESH\"
    -D TERMINAL_ID=0
    -D RELAY_PIN=0
    ;-D WIFI       ; Incluir se o Wi-Fi estiver sendo utilizado
    ;-D NRF24       ; Exemplo de uso de rádio NRF24. Ajuste conforme necessário.
    -D RADIO_DUMMY
    ;-D RESET
    -D NRF24_CE=9  ; Pino CE ajustado conforme necessário
    -D NRF24_CSN=10 ; Pino CSN ajustado conforme necessário
    -D DEBUG_ON    ; Para habilitar logs de debug
    ;-D WIFI_SSID=\"kcaza\"
    ;-D WIFI_PASSWORD=\"3938373635\"
    ;-D WIFI_SSID=\"VIVOFIBRA-A360\"
    ;-D WIFI_PASSWORD=\"6C9FCEC12A\"


    

; ======================
; ESP32 NRF24 Gateway
; ======================

[env:gw_esp32_nrf24]
platform = espressif32
board = esp32dev  ; Or your specific ESP32 board
framework = arduino
monitor_speed = 115200
monitor_raw = yes
monitor_port = COM4  ; Update with your port
upload_port = COM4   ; Update with your port

; NRF24 requires SPI and these pins need to be defined
; Default SPI pins for most ESP32 boards:
;   MOSI: GPIO23
;   MISO: GPIO19
;   SCK: GPIO18
;   CSN: GPIO5 (adjust according to your wiring)
;   CE: GPIO4 (adjust according to your wiring)

build_flags =
    -D ALEXA_MAX_CLIENTS=5
    -D GATEWAY
    -D TERMINAL_NAME=\"gw_nrf24\"
    -D TERMINAL_ID=0
    -D RELAY_PIN=0
    -D NRF24
    ;-D DUMMY
    -D ESP32
    -D WIFI
    -D WIFIMANAGER
    -D WS
    -D ALEXA
    -D DEBUG_ON
    -D NRF24_CE=4     ; Customize based on your wiring
    -D NRF24_CSN=5    ; Customize based on your wiring
    -D NRF24_CHANNEL=76  ; Default channel (0-125)

lib_deps =
    nRF24/RF24 @ ^1.4.7
    bblanchon/ArduinoJson @ ^6.21.2
    arduino-libraries/NTPClient @ ^3.2.1
    esphome/ESPAsyncWebServer-esphome @ ^3.3.0
    ;me-no-dev/ESPAsyncUDP@^1.2.0
    https://github.com/ropg/ezTime.git
    ESPAsyncWiFiManager



